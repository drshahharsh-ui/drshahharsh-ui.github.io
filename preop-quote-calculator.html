function fmt(n){return n?'₹'+Math.round(n).toLocaleString('en-IN'):'—'}
function calc(){
  const proc=document.getElementById('proc').value;
  const payer=document.getElementById('payer').value;
  const ins=document.getElementById('insurer').value;
  const los=parseFloat(document.getElementById('los').value)||7;
  const type=document.getElementById('type').value;
  
  document.getElementById('rob-inputs').style.display=type==='Robotic'?'block':'none';
  
  const key=proc+'__'+payer;
  const b=benchmarks[key];
  if(!b){
    document.getElementById('results').innerHTML='<div style="color:#c62828">No benchmark data for this procedure × payer combination.</div>';
    return;
  }
  
  const inv=b.avg_inv||0;
  const otc=b.avg_ot_cons||0;
  const otp=b.avg_ot_pharm||0;
  const ipp=b.avg_pharm||0;
  const roomDay=(b.avg_room||0)/(b.avg_los||1);
  const roomTotal=roomDay*los;
  const ot=b.avg_ot||0;
  const others=(b.avg_net||0)-(inv+otc+otp+ipp+(b.avg_room||0)+ot);  // residual
  
  let total=inv+otc+otp+ipp+roomTotal+ot+others;
  let rob_extra=0;
  if(type==='Robotic'){
    rob_extra=parseFloat(document.getElementById('rob-eq').value||0)+parseFloat(document.getElementById('rob-disp').value||0);
    if(payer==='CASH') total+=rob_extra;
  }
  
  let html=`
    <div class="result-row"><span>Surgeon Fee (Invasive)</span><strong>${fmt(inv)}</strong></div>
    <div class="result-row"><span>OT Charges</span><strong>${fmt(ot)}</strong></div>
    <div class="result-row"><span>OT Consumables</span><strong>${fmt(otc)}</strong></div>
    <div class="result-row"><span>OT Pharmacy</span><strong>${fmt(otp)}</strong></div>
    <div class="result-row"><span>Room Rent (${los}d × ₹${Math.round(roomDay).toLocaleString('en-IN')})</span><strong>${fmt(roomTotal)}</strong></div>
    <div class="result-row"><span>IP Pharmacy</span><strong>${fmt(ipp)}</strong></div>
    <div class="result-row"><span>Other (consultation, investigations, etc.)</span><strong>${fmt(others)}</strong></div>
  `;
  if(type==='Robotic'&&payer==='CASH') html+=`<div class="result-row"><span>Robotic equipment + disposables</span><strong>${fmt(rob_extra)}</strong></div>`;
  html+=`<div class="total-row">ESTIMATED TOTAL: ${fmt(total)}</div>`;
  html+=`<div style="font-size:11px;color:#7a8a99;margin-top:8px">Avg LOS for this proc: ${(b.avg_los||0).toFixed(1)} days · Avg historical bill: ${fmt(b.avg_net)} (n=${b.n})</div>`;
  
  document.getElementById('results').innerHTML=html;
}
['proc','payer','insurer','los','type','rob-eq','rob-disp'].forEach(i=>{const el=document.getElementById(i);if(el)el.addEventListener('input',calc);});
calc();
</script></body></html>
